name: runtime-pack

# Packs a real simulator RuntimeRoot into downloadable chunks.
#
# Separate from build-probe on purpose: this is slow and heavy (mounts a 6.8GB
# image, streams out several GB), while build-probe runs on every iteration and
# needs to stay fast.
#
# Why repack at all, rather than have the phone fetch Apple's dmg directly:
# the dmg is UDIF wrapping an APFS volume. macOS mounts that with one call;
# iOS has no hdiutil, no mount, and no APFS reader available to an app. Doing
# it on-device would mean writing a UDIF parser AND an APFS reader. Repacking
# here turns that into tar+gzip, which is ~150 lines of tar parsing on the
# device plus zlib, which iOS already ships.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish chunks under"
        default: "runtime-ios17.2"
      dry_run:
        description: "Only measure sizes; do not upload"
        default: "true"
      subset:
        description: >
          Path under RuntimeRoot to pack instead of the whole tree, e.g.
          usr/lib/system. Lets the whole download+extract path be proven on
          ~50MB before committing to a multi-GB transfer. Empty = full tree.
        default: "usr/lib/system"

permissions:
  contents: write

jobs:
  pack:
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Report available disk (this is the binding constraint)
        run: |
          df -h /
          echo "=== runtime images present ==="
          ls -lh /Library/Developer/CoreSimulator/Images/*.dmg 2>/dev/null || echo "(none)"

      - name: Mount the runtime image
        run: |
          # Largest image is the iOS runtime. sudo because they're root:wheel.
          DMG=$(ls -S /Library/Developer/CoreSimulator/Images/*.dmg 2>/dev/null | head -1)
          echo "dmg: $DMG"
          ls -lh "$DMG"
          echo "DMG=$DMG" >> "$GITHUB_ENV"

          mkdir -p /tmp/simrt
          sudo hdiutil attach "$DMG" -mountpoint /tmp/simrt -nobrowse -readonly
          RT=$(find /tmp/simrt -maxdepth 6 -name "*.simruntime" | head -1)
          echo "runtime bundle: $RT"
          echo "RT=$RT" >> "$GITHUB_ENV"

          echo "=== sizes ==="
          du -sh "$RT" || true
          du -sh "$RT/Contents/Resources/RuntimeRoot" || true
          echo "=== the dyld shared cache (the bulk of a boot) ==="
          find "$RT/Contents/Resources/RuntimeRoot/System/Library/dyld" -maxdepth 1 -type f \
            -exec ls -lh {} \; 2>/dev/null | head -10 || echo "(no dyld dir)"

      - name: Create the release to hold the chunks
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.tag }}"
          gh release create "$TAG" \
            --title "Simulator RuntimeRoot (chunked)" \
            --notes "tar.gz of a real simulator RuntimeRoot, split into <2GB chunks for on-device download." \
            || echo "(release already exists, reusing)"

          # Delete every existing asset first. A re-run with a different
          # subset (or better compression) can produce FEWER chunks, and
          # leftovers from a previous run would still be listed -- the device
          # walks chunk .000, .001, ... until one 404s, so a stale .003 would
          # silently corrupt the stream. Clearing first makes each run's
          # asset set authoritative.
          for asset in $(gh release view "$TAG" --json assets -q '.assets[].name' 2>/dev/null); do
            echo "deleting stale asset: $asset"
            gh release delete-asset "$TAG" "$asset" --yes || true
          done

      - name: Pack and upload chunks
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RT/Contents/Resources"
          SUBSET="${{ github.event.inputs.subset }}"
          if [ -n "$SUBSET" ]; then
            TARGET="RuntimeRoot/$SUBSET"
            echo "packing SUBSET: $TARGET"
            du -sh "$TARGET" || true
          else
            TARGET="RuntimeRoot"
            echo "packing FULL tree"
          fi

          # Paths are stored relative to Contents/Resources, so extraction on
          # device recreates RuntimeRoot/... in place regardless of subset.
          #
          # Streams straight from the read-only mount: never materialises the
          # 16GB tree or the full archive on the runner's disk.
          tar czf - "$TARGET" \
            | python3 "$GITHUB_WORKSPACE/tools/pack_stream_upload.py" \
                "${{ github.event.inputs.tag }}" runtimeroot.tar.gz

      - name: Unmount
        if: always()
        run: sudo hdiutil detach /tmp/simrt 2>&1 | tail -2 || true
