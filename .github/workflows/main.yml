name: build-probe

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  # Pinned explicitly rather than relying on whatever Xcode is implicitly
  # selected -- the runner's default Xcode.app turned out to be 15.4 /
  # iPhoneOS17.5.sdk, not the newest available, which would have silently
  # defeated the point of targeting iOS 18. This is the closest real iOS 18
  # SDK actually present on the runner.
  IOS18_DEVELOPER_DIR: /Applications/Xcode_16.1.app/Contents/Developer

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show selected iOS 18 Xcode / SDK info
        run: |
          DEVELOPER_DIR="$IOS18_DEVELOPER_DIR" xcodebuild -version
          DEVELOPER_DIR="$IOS18_DEVELOPER_DIR" xcrun --sdk iphoneos --show-sdk-path
          DEVELOPER_DIR="$IOS18_DEVELOPER_DIR" xcrun --sdk iphoneos --show-sdk-version

      - name: Locate and package real CoreSimulator binaries
        run: |
          echo "--- checking known CoreSimulator.framework locations ---"
          ls -la /Library/Developer/PrivateFrameworks/CoreSimulator.framework/ 2>&1 || echo "not at system PrivateFrameworks path"
          find /Applications/Xcode_16.1.app -iname "CoreSimulator*" -maxdepth 8 2>&1 || true

          mkdir -p coresim-out
          FW=/Library/Developer/PrivateFrameworks/CoreSimulator.framework
          if [ -e "$FW/CoreSimulator" ]; then
            echo "--- found framework binary, copying ---"
            cp "$FW/CoreSimulator" coresim-out/CoreSimulator
            file coresim-out/CoreSimulator
            otool -l coresim-out/CoreSimulator | grep -A4 LC_BUILD_VERSION || true
          fi
          if [ -e "$FW/Versions/A/CoreSimulator" ]; then
            cp "$FW/Versions/A/CoreSimulator" coresim-out/CoreSimulator
            file coresim-out/CoreSimulator
          fi

          echo "--- looking for CoreSimulatorService within the framework ---"
          find "$FW" -iname "CoreSimulatorService" 2>&1 || true
          SVC=$(find "$FW" -iname "CoreSimulatorService" -type f 2>/dev/null | head -1)
          if [ -n "$SVC" ]; then
            cp "$SVC" coresim-out/CoreSimulatorService
            file coresim-out/CoreSimulatorService
          fi

          ls -la coresim-out/

      - uses: actions/upload-artifact@v4
        with:
          name: coresimulator-binaries
          path: coresim-out
          if-no-files-found: warn
          retention-days: 14

      - name: Thin and patch CoreSimulator for iOS
        run: |
          lipo -thin arm64e coresim-out/CoreSimulator -output coresim_thin.bin
          file coresim_thin.bin
          python3 tools/patch_coresimulator.py coresim_thin.bin coresim_patched.dylib

      - name: Compile CoreSimulator stub libraries
        run: |
          SDK=$(DEVELOPER_DIR="$IOS18_DEVELOPER_DIR" xcrun --sdk iphoneos --show-sdk-path)
          CLANG() { DEVELOPER_DIR="$IOS18_DEVELOPER_DIR" clang -arch arm64 -isysroot "$SDK" -miphoneos-version-min=15.0 -dynamiclib "$@"; }

          mkdir -p coresim-stub-out
          # Empty stubs: wave 1 deliberately doesn't guess ~90 symbols' real
          # behavior -- dyld's own binding error will name the actual first
          # one CoreSimulator needs.
          for name in ROCKit DeviceIdentity CoreSimulatorUtilities CoreServices SimPasteboardPlus CoreSimDeviceIO; do
            CLANG -o "coresim-stub-out/$name" coresim-stubs/empty_stub.c
          done
          CLANG -o coresim-stub-out/libDiagnosticMessagesClient.dylib coresim-stubs/empty_stub.c
          CLANG -o coresim-stub-out/libxcselect.dylib coresim-stubs/empty_stub.c

          # Real, correct answers (not placeholders): iOS never has Rosetta.
          CLANG -o coresim-stub-out/libRosetta.dylib coresim-stubs/libRosetta_stub.c

          # Real documented signatures, wave-1 stub bodies.
          CLANG -framework CoreFoundation -fobjc-arc \
                -o coresim-stub-out/ServiceManagement coresim-stubs/ServiceManagement_stub.m

          # Real public DiskArbitration API, all 16 symbols known from
          # earlier symbol recon -- implemented in full, not left empty.
          CLANG -framework CoreFoundation \
                -o coresim-stub-out/DiskArbitration coresim-stubs/DiskArbitration_stub.c

          ls -la coresim-stub-out/

      - name: Symbol-level recon against CoreSimulator and the real mounted RuntimeRoot
        run: |
          mkdir -p recon-out
          CS=/Library/Developer/PrivateFrameworks/CoreSimulator.framework/CoreSimulator

          echo "=== CoreSimulator undefined symbols, annotated by source library (arm64e) ==="
          nm -m -arch arm64e "$CS" 2>&1 | grep "(from " > recon-out/coresimulator-undefined-annotated.txt || true
          wc -l recon-out/coresimulator-undefined-annotated.txt

          echo "--- bucket 2: AppKit-sourced symbols actually referenced ---"
          grep "(from AppKit)" recon-out/coresimulator-undefined-annotated.txt || echo "(none found -- zero static AppKit symbol references)"

          echo "--- bucket 3: DiskArbitration-sourced symbols actually referenced ---"
          grep "(from DiskArbitration)" recon-out/coresimulator-undefined-annotated.txt || echo "(none found)"

          echo "--- bucket 5: private-framework-sourced symbols actually referenced ---"
          for lib in ROCKit DeviceIdentity CoreSimulatorUtilities SimPasteboardPlus; do
            echo "  -- from $lib --"
            grep "(from $lib)" recon-out/coresimulator-undefined-annotated.txt || echo "    (none found)"
          done

          echo "--- previously-uncounted hard deps: libxcselect, libRosetta, CoreServices, ServiceManagement ---"
          for lib in libxcselect libRosetta CoreServices ServiceManagement; do
            echo "  -- from $lib --"
            grep "(from $lib)" recon-out/coresimulator-undefined-annotated.txt || echo "    (none found)"
          done

          echo "=== locating real Simulator-flavored UIKit/Foundation in the mounted iOS 18.1 RuntimeRoot ==="
          VOL=/Library/Developer/CoreSimulator/Volumes/iOS_22B81
          find "$VOL" -maxdepth 2 2>&1 || true
          UIKIT_SIM=$(find "$VOL" -path "*/UIKit.framework/UIKit" -type f 2>/dev/null | head -1)
          FOUNDATION_SIM=$(find "$VOL" -path "*/Foundation.framework/Foundation" -type f 2>/dev/null | head -1)
          echo "UIKit: $UIKIT_SIM"
          echo "Foundation: $FOUNDATION_SIM"

          if [ -n "$UIKIT_SIM" ]; then
            file "$UIKIT_SIM"
            nm -g "$UIKIT_SIM" 2>/dev/null > recon-out/uikit-sim-exported-symbols.txt || true
            wc -l recon-out/uikit-sim-exported-symbols.txt
          fi
          if [ -n "$FOUNDATION_SIM" ]; then
            nm -g "$FOUNDATION_SIM" 2>/dev/null > recon-out/foundation-sim-exported-symbols.txt || true
            wc -l recon-out/foundation-sim-exported-symbols.txt
          fi

          ls -la recon-out/

      - uses: actions/upload-artifact@v4
        with:
          name: symbol-recon
          path: recon-out
          if-no-files-found: warn
          retention-days: 14

      - name: Identify which dmg is the iOS 18.1 RuntimeRoot (metadata only, no mounting)
        run: |
          echo "=== images.plist structure ==="
          python3 tools/dump_images_plist.py
          echo "=== Profiles/Runtimes directory ==="
          find /Library/Developer/CoreSimulator/Profiles/Runtimes -maxdepth 3 2>&1 || echo "(no such directory)"

      - name: Mount whatever real Cryptex dmgs actually exist on disk and probe each for UIKit
        timeout-minutes: 8
        run: |
          # images.plist's recorded path for the iOS 18.1 entry doesn't exist
          # on disk -- stale/incomplete metadata, not fixable by parsing it
          # more carefully. Ground truth is the filesystem: find every real
          # .dmg under the Cryptex bundle tree and just try each one directly,
          # confirming by content (does it actually contain UIKit.framework)
          # rather than by trusting any recorded version label.
          echo "=== real dmg files under Cryptex/Images/bundle ==="
          find /Library/Developer/CoreSimulator/Cryptex/Images/bundle -name "*.dmg" 2>&1 | tee /tmp/cryptex_dmgs.txt

          i=0
          while read -r dmg; do
            [ -z "$dmg" ] && continue
            i=$((i+1))
            MP="/tmp/mnt/cryptex$i"
            mkdir -p "$MP"
            if sudo hdiutil attach -nobrowse -readonly -mountpoint "$MP" "$dmg" > /tmp/attach.log 2>&1; then
              HIT=$(find "$MP" -path "*/UIKit.framework/UIKit" -type f 2>/dev/null | head -1)
              echo "$dmg -> mounted at $MP, UIKit found: ${HIT:-no}"
              if [ -n "$HIT" ]; then
                echo "$MP" > /tmp/matched_mountpoint.txt
                echo "*** MATCH ***"
                break
              fi
              sudo hdiutil detach "$MP" -quiet 2>&1 || true
            else
              echo "$dmg -> attach failed"
            fi
          done < /tmp/cryptex_dmgs.txt

          if [ -f /tmp/matched_mountpoint.txt ]; then
            echo "--- contents of matched volume ---"
            find "$(cat /tmp/matched_mountpoint.txt)" -maxdepth 3 2>&1 | head -50
          else
            echo "no dmg under Cryptex/Images/bundle contained UIKit.framework"
          fi

      - name: Dump real Simulator-flavored UIKit/Foundation exported symbols
        run: |
          mkdir -p recon-out2
          SEARCH_ROOT="/tmp/mnt"
          if [ -f /tmp/matched_mountpoint.txt ]; then
            SEARCH_ROOT=$(cat /tmp/matched_mountpoint.txt)
          fi
          UIKIT_SIM=$(find "$SEARCH_ROOT" -path "*/UIKit.framework/UIKit" -type f 2>/dev/null | head -1)
          FOUNDATION_SIM=$(find "$SEARCH_ROOT" -path "*/Foundation.framework/Foundation" -type f 2>/dev/null | head -1)
          echo "UIKit: $UIKIT_SIM"
          echo "Foundation: $FOUNDATION_SIM"

          if [ -n "$UIKIT_SIM" ]; then
            file "$UIKIT_SIM"
            nm -g "$UIKIT_SIM" 2>/dev/null > recon-out2/uikit-sim-exported-symbols.txt || true
            wc -l recon-out2/uikit-sim-exported-symbols.txt
          fi
          if [ -n "$FOUNDATION_SIM" ]; then
            nm -g "$FOUNDATION_SIM" 2>/dev/null > recon-out2/foundation-sim-exported-symbols.txt || true
            wc -l recon-out2/foundation-sim-exported-symbols.txt
          fi
          ls -la recon-out2/

      - uses: actions/upload-artifact@v4
        with:
          name: sim-framework-symbols
          path: recon-out2
          if-no-files-found: warn
          retention-days: 14

      - name: Compile target (as a normal executable first)
        run: |
          SDK=$(DEVELOPER_DIR="$IOS18_DEVELOPER_DIR" xcrun --sdk iphoneos --show-sdk-path)
          DEVELOPER_DIR="$IOS18_DEVELOPER_DIR" clang -arch arm64 -isysroot "$SDK" -miphoneos-version-min=15.0 \
                -fobjc-arc -framework UIKit -framework Foundation \
                -o target_raw target.m

      - name: Patch target into a dlopen-able dylib
        run: |
          python3 tools/patch_macho.py target_raw target.dylib

      - name: Compile Probe app
        run: |
          SDK=$(DEVELOPER_DIR="$IOS18_DEVELOPER_DIR" xcrun --sdk iphoneos --show-sdk-path)
          DEVELOPER_DIR="$IOS18_DEVELOPER_DIR" clang -arch arm64 -isysroot "$SDK" -miphoneos-version-min=15.0 \
                -fobjc-arc -framework UIKit -framework Foundation \
                -o ProbeBin Probe/main.m

      - name: Compile LaunchHelper extension
        run: |
          SDK=$(DEVELOPER_DIR="$IOS18_DEVELOPER_DIR" xcrun --sdk iphoneos --show-sdk-path)
          # No main() in LaunchHelper/main.m -- entry point is set explicitly
          # to Foundation's own real NSExtensionMain, since raw clang has none
          # of Xcode's implicit app-extension product-type wiring available.
          DEVELOPER_DIR="$IOS18_DEVELOPER_DIR" clang -arch arm64 -isysroot "$SDK" -miphoneos-version-min=15.0 \
                -fobjc-arc -framework UIKit -framework Foundation \
                -Wl,-e,_NSExtensionMain \
                -o LaunchHelperBin LaunchHelper/main.m

      - name: Assemble .app bundle
        run: |
          mkdir -p Payload/Probe.app
          cp ProbeBin Payload/Probe.app/Probe
          cp Probe/Info.plist Payload/Probe.app/Info.plist
          cp target.dylib Payload/Probe.app/target.dylib

          mkdir -p Payload/Probe.app/PlugIns/LaunchHelper.appex
          cp LaunchHelperBin Payload/Probe.app/PlugIns/LaunchHelper.appex/LaunchHelper
          cp LaunchHelper/Info.plist Payload/Probe.app/PlugIns/LaunchHelper.appex/Info.plist
          cp target.dylib Payload/Probe.app/PlugIns/LaunchHelper.appex/target.dylib

          cp coresim_patched.dylib Payload/Probe.app/coresim_target.dylib
          mkdir -p Payload/Probe.app/Frameworks
          cp coresim-stub-out/* Payload/Probe.app/Frameworks/

      - name: Ad-hoc sign with entitlements (App Group intent for AltStore's resign to carry forward)
        run: |
          # Ad-hoc (-s -), not a real identity -- AltStore replaces this
          # signature entirely at install time. The point is embedding the
          # App Group entitlement so its resigning tool has something to
          # read and request a matching capability for, same pattern real
          # sideloaded apps ship with. Nested code signed first.
          codesign -s - --entitlements LaunchHelper/LaunchHelper.entitlements \
                --force Payload/Probe.app/PlugIns/LaunchHelper.appex
          codesign -s - --entitlements Probe/Probe.entitlements \
                --force Payload/Probe.app

      - name: Zip .ipa
        run: |
          zip -r Probe-unsigned.ipa Payload
          # also keep the loose .app around for inspection
          cp -R Payload/Probe.app ./Probe.app

      - uses: actions/upload-artifact@v4
        with:
          name: probe-build
          path: |
            Probe-unsigned.ipa
            Probe.app
          retention-days: 14
