name: build-probe

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  # Pinned explicitly rather than relying on whatever Xcode is implicitly
  # selected -- the runner's default Xcode.app turned out to be 15.4 /
  # iPhoneOS17.5.sdk, not the newest available, which would have silently
  # defeated the point of targeting iOS 18. This is the closest real iOS 18
  # SDK actually present on the runner.
  IOS18_DEVELOPER_DIR: /Applications/Xcode_16.1.app/Contents/Developer

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show selected iOS 18 Xcode / SDK info
        run: |
          DEVELOPER_DIR="$IOS18_DEVELOPER_DIR" xcodebuild -version
          DEVELOPER_DIR="$IOS18_DEVELOPER_DIR" xcrun --sdk iphoneos --show-sdk-path
          DEVELOPER_DIR="$IOS18_DEVELOPER_DIR" xcrun --sdk iphoneos --show-sdk-version

      - name: Compile target (as a normal executable first)
        run: |
          SDK=$(DEVELOPER_DIR="$IOS18_DEVELOPER_DIR" xcrun --sdk iphoneos --show-sdk-path)
          DEVELOPER_DIR="$IOS18_DEVELOPER_DIR" clang -arch arm64 -isysroot "$SDK" -miphoneos-version-min=15.0 \
                -fobjc-arc -framework UIKit -framework Foundation \
                -o target_raw target.m

      - name: Patch target into a dlopen-able dylib
        run: |
          python3 tools/patch_macho.py target_raw target.dylib

      - name: Compile Probe app
        run: |
          SDK=$(DEVELOPER_DIR="$IOS18_DEVELOPER_DIR" xcrun --sdk iphoneos --show-sdk-path)
          DEVELOPER_DIR="$IOS18_DEVELOPER_DIR" clang -arch arm64 -isysroot "$SDK" -miphoneos-version-min=15.0 \
                -fobjc-arc -framework UIKit -framework Foundation \
                -o ProbeBin Probe/main.m

      - name: Assemble .app bundle and .ipa
        run: |
          mkdir -p Payload/Probe.app
          cp ProbeBin Payload/Probe.app/Probe
          cp Probe/Info.plist Payload/Probe.app/Info.plist
          cp target.dylib Payload/Probe.app/target.dylib
          zip -r Probe-unsigned.ipa Payload
          # also keep the loose .app around for inspection
          cp -R Payload/Probe.app ./Probe.app

      - uses: actions/upload-artifact@v4
        with:
          name: probe-build
          path: |
            Probe-unsigned.ipa
            Probe.app
          retention-days: 14
