name: build-probe

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode / SDK info
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: TEMP -- list all installed Xcode versions and their iOS SDKs
        run: |
          ls /Applications | grep -i xcode || true
          echo '---'
          for d in /Applications/Xcode*.app; do
            echo "== $d =="
            "$d/Contents/Developer/usr/bin/xcodebuild" -version 2>&1 || true
            ls "$d/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/" 2>&1 || true
            echo
          done

      - name: Compile target (as a normal executable first)
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          clang -arch arm64 -isysroot "$SDK" -miphoneos-version-min=15.0 \
                -fobjc-arc -framework UIKit -framework Foundation \
                -o target_raw target.m

      - name: Patch target into a dlopen-able dylib
        run: |
          python3 tools/patch_macho.py target_raw target.dylib

      - name: Compile Probe app
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          clang -arch arm64 -isysroot "$SDK" -miphoneos-version-min=15.0 \
                -fobjc-arc -framework UIKit -framework Foundation \
                -o ProbeBin Probe/main.m

      - name: Assemble .app bundle and .ipa
        run: |
          mkdir -p Payload/Probe.app
          cp ProbeBin Payload/Probe.app/Probe
          cp Probe/Info.plist Payload/Probe.app/Info.plist
          cp target.dylib Payload/Probe.app/target.dylib
          zip -r Probe-unsigned.ipa Payload
          # also keep the loose .app around for inspection
          cp -R Payload/Probe.app ./Probe.app

      - uses: actions/upload-artifact@v4
        with:
          name: probe-build
          path: |
            Probe-unsigned.ipa
            Probe.app
          retention-days: 14
