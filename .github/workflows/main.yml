name: build-probe

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  # Pinned explicitly rather than relying on whatever Xcode is implicitly
  # selected -- the runner's default Xcode.app turned out to be 15.4 /
  # iPhoneOS17.5.sdk, not the newest available, which would have silently
  # defeated the point of targeting iOS 18. This is the closest real iOS 18
  # SDK actually present on the runner.
  IOS18_DEVELOPER_DIR: /Applications/Xcode_16.1.app/Contents/Developer

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show selected iOS 18 Xcode / SDK info
        run: |
          DEVELOPER_DIR="$IOS18_DEVELOPER_DIR" xcodebuild -version
          DEVELOPER_DIR="$IOS18_DEVELOPER_DIR" xcrun --sdk iphoneos --show-sdk-path
          DEVELOPER_DIR="$IOS18_DEVELOPER_DIR" xcrun --sdk iphoneos --show-sdk-version

      - name: Locate and package real CoreSimulator binaries
        run: |
          echo "--- checking known CoreSimulator.framework locations ---"
          ls -la /Library/Developer/PrivateFrameworks/CoreSimulator.framework/ 2>&1 || echo "not at system PrivateFrameworks path"
          find /Applications/Xcode_16.1.app -iname "CoreSimulator*" -maxdepth 8 2>&1 || true

          mkdir -p coresim-out
          FW=/Library/Developer/PrivateFrameworks/CoreSimulator.framework
          if [ -e "$FW/CoreSimulator" ]; then
            echo "--- found framework binary, copying ---"
            cp "$FW/CoreSimulator" coresim-out/CoreSimulator
            file coresim-out/CoreSimulator
            otool -l coresim-out/CoreSimulator | grep -A4 LC_BUILD_VERSION || true
          fi
          if [ -e "$FW/Versions/A/CoreSimulator" ]; then
            cp "$FW/Versions/A/CoreSimulator" coresim-out/CoreSimulator
            file coresim-out/CoreSimulator
          fi

          echo "--- looking for CoreSimulatorService within the framework ---"
          find "$FW" -iname "CoreSimulatorService" 2>&1 || true
          SVC=$(find "$FW" -iname "CoreSimulatorService" -type f 2>/dev/null | head -1)
          if [ -n "$SVC" ]; then
            cp "$SVC" coresim-out/CoreSimulatorService
            file coresim-out/CoreSimulatorService
          fi

          ls -la coresim-out/

      - uses: actions/upload-artifact@v4
        with:
          name: coresimulator-binaries
          path: coresim-out
          if-no-files-found: warn
          retention-days: 14

      - name: Thin and patch CoreSimulator for iOS
        run: |
          lipo -thin arm64e coresim-out/CoreSimulator -output coresim_thin.bin
          file coresim_thin.bin
          python3 tools/patch_coresimulator.py coresim_thin.bin coresim_patched.dylib

      - name: Compile CoreSimulator stub libraries
        run: |
          SDK=$(DEVELOPER_DIR="$IOS18_DEVELOPER_DIR" xcrun --sdk iphoneos --show-sdk-path)
          CLANG() { DEVELOPER_DIR="$IOS18_DEVELOPER_DIR" clang -arch arm64 -isysroot "$SDK" -miphoneos-version-min=15.0 -dynamiclib "$@"; }

          mkdir -p coresim-stub-out
          # Empty stubs: wave 1 deliberately doesn't guess ~90 symbols' real
          # behavior -- dyld's own binding error will name the actual first
          # one CoreSimulator needs.
          for name in CoreServices SimPasteboardPlus; do
            CLANG -o "coresim-stub-out/$name" coresim-stubs/empty_stub.c
          done
          CLANG -o coresim-stub-out/libxcselect.dylib coresim-stubs/empty_stub.c

          # Only one symbol referenced (confirmed via symbol recon):
          # msgtracer_log_with_keys, a log function -- safe empty no-op body.
          CLANG -o coresim-stub-out/libDiagnosticMessagesClient.dylib coresim-stubs/libDiagnosticMessagesClient_stub.c

          # Real, correct answers (not placeholders): iOS never has Rosetta.
          CLANG -o coresim-stub-out/libRosetta.dylib coresim-stubs/libRosetta_stub.c

          # Real documented signatures, wave-1 stub bodies.
          CLANG -framework CoreFoundation -fobjc-arc \
                -o coresim-stub-out/ServiceManagement coresim-stubs/ServiceManagement_stub.m

          # Real public DiskArbitration API, all 16 symbols known from
          # earlier symbol recon -- implemented in full, not left empty.
          CLANG -framework CoreFoundation \
                -o coresim-stub-out/DiskArbitration coresim-stubs/DiskArbitration_stub.c

          # Private/undocumented, but all 16 symbol names known from earlier
          # recon -- DeviceIdentityIsSupported=false is a real correct
          # answer, the rest just need to exist for eager linking.
          CLANG -framework CoreFoundation \
                -o coresim-stub-out/DeviceIdentity coresim-stubs/DeviceIdentity_stub.c

          # Private/undocumented, but all 16 symbols known from re-running
          # the existing symbol-recon step -- 2 Objective-C classes plus 14
          # SimFeature* string constants plus 1 function.
          CLANG -framework Foundation -fobjc-arc \
                -o coresim-stub-out/CoreSimDeviceIO coresim-stubs/CoreSimDeviceIO_stub.m

          # Private/undocumented, 66 symbols known from re-running the
          # existing symbol-recon step: 3 Swift-mangled classes, 42
          # SimPrefKey*/SimPerfKey* constants, and a mix of real/guessed
          # semantic functions.
          CLANG -framework Foundation -fobjc-arc \
                -o coresim-stub-out/CoreSimulatorUtilities coresim-stubs/CoreSimulatorUtilities_stub.m

          # Private/undocumented, 7 symbols known from re-running the
          # existing symbol-recon step: a real (not guessed) NSArray/
          # NSDictionary/NSError/NSUUID <-> xpc_object_t conversion bridge.
          CLANG -framework Foundation -fobjc-arc \
                -o coresim-stub-out/ROCKit coresim-stubs/ROCKit_stub.m

          ls -la coresim-stub-out/

      - name: Symbol-level recon against CoreSimulator and the real mounted RuntimeRoot
        run: |
          mkdir -p recon-out
          CS=/Library/Developer/PrivateFrameworks/CoreSimulator.framework/CoreSimulator

          echo "=== CoreSimulator undefined symbols, annotated by source library (arm64e) ==="
          nm -m -arch arm64e "$CS" 2>&1 | grep "(from " > recon-out/coresimulator-undefined-annotated.txt || true
          wc -l recon-out/coresimulator-undefined-annotated.txt

          echo "--- bucket 2: AppKit-sourced symbols actually referenced ---"
          grep "(from AppKit)" recon-out/coresimulator-undefined-annotated.txt || echo "(none found -- zero static AppKit symbol references)"

          echo "--- bucket 3: DiskArbitration-sourced symbols actually referenced ---"
          grep "(from DiskArbitration)" recon-out/coresimulator-undefined-annotated.txt || echo "(none found)"

          echo "--- bucket 5: private-framework-sourced symbols actually referenced ---"
          for lib in ROCKit DeviceIdentity CoreSimulatorUtilities SimPasteboardPlus; do
            echo "  -- from $lib --"
            grep "(from $lib)" recon-out/coresimulator-undefined-annotated.txt || echo "    (none found)"
          done

          echo "--- previously-uncounted hard deps: libxcselect, libRosetta, CoreServices, ServiceManagement ---"
          for lib in libxcselect libRosetta CoreServices ServiceManagement; do
            echo "  -- from $lib --"
            grep "(from $lib)" recon-out/coresimulator-undefined-annotated.txt || echo "    (none found)"
          done

          echo "=== locating real Simulator-flavored UIKit/Foundation in the mounted iOS 18.1 RuntimeRoot ==="
          VOL=/Library/Developer/CoreSimulator/Volumes/iOS_22B81
          find "$VOL" -maxdepth 2 2>&1 || true
          UIKIT_SIM=$(find "$VOL" -path "*/UIKit.framework/UIKit" -type f 2>/dev/null | head -1)
          FOUNDATION_SIM=$(find "$VOL" -path "*/Foundation.framework/Foundation" -type f 2>/dev/null | head -1)
          echo "UIKit: $UIKIT_SIM"
          echo "Foundation: $FOUNDATION_SIM"

          if [ -n "$UIKIT_SIM" ]; then
            file "$UIKIT_SIM"
            nm -g "$UIKIT_SIM" 2>/dev/null > recon-out/uikit-sim-exported-symbols.txt || true
            wc -l recon-out/uikit-sim-exported-symbols.txt
          fi
          if [ -n "$FOUNDATION_SIM" ]; then
            nm -g "$FOUNDATION_SIM" 2>/dev/null > recon-out/foundation-sim-exported-symbols.txt || true
            wc -l recon-out/foundation-sim-exported-symbols.txt
          fi

          ls -la recon-out/

      - name: Dump real .simdevicetype / .simruntime profiles (ground truth for the schema)
        run: |
          # The synthetic profile fed to the on-device context guesses both
          # the profile.plist keys and the bundle layout. The runner has the
          # real articles on disk -- read them instead of guessing.
          mkdir -p profile-out

          echo "=== searching for real .simdevicetype bundles ==="
          find /Applications/Xcode_16.1.app -name "*.simdevicetype" -maxdepth 12 2>/dev/null | head -20 \
            > profile-out/devicetype-paths.txt || true
          find /Library/Developer/CoreSimulator -name "*.simdevicetype" -maxdepth 8 2>/dev/null | head -20 \
            >> profile-out/devicetype-paths.txt || true
          cat profile-out/devicetype-paths.txt

          DT=$(head -1 profile-out/devicetype-paths.txt)
          if [ -n "$DT" ]; then
            echo "=== exact internal layout of: $DT ==="
            find "$DT" | sed "s|$DT|<BUNDLE>|" | tee profile-out/devicetype-layout.txt

            echo "=== its Info.plist ==="
            INFO=$(find "$DT" -name "Info.plist" | head -1)
            [ -n "$INFO" ] && plutil -convert xml1 -o - "$INFO" | tee profile-out/devicetype-Info.plist

            echo "=== its profile.plist (THE schema we need) ==="
            PROF=$(find "$DT" -name "profile.plist" | head -1)
            [ -n "$PROF" ] && plutil -convert xml1 -o - "$PROF" | tee profile-out/devicetype-profile.plist
          fi

          echo "=== searching for real .simruntime bundles ==="
          find /Library/Developer/CoreSimulator/Profiles/Runtimes -maxdepth 2 -name "*.simruntime" 2>/dev/null \
            > profile-out/runtime-paths.txt || true
          find /Applications/Xcode_16.1.app -name "*.simruntime" -maxdepth 12 2>/dev/null | head -5 \
            >> profile-out/runtime-paths.txt || true
          cat profile-out/runtime-paths.txt

          RT=$(head -1 profile-out/runtime-paths.txt)
          if [ -n "$RT" ]; then
            echo "=== runtime bundle top-level layout (not recursive -- RuntimeRoot is huge) ==="
            find "$RT" -maxdepth 3 | sed "s|$RT|<RUNTIME>|" | head -40 | tee profile-out/runtime-layout.txt

            RINFO=$(find "$RT" -maxdepth 3 -name "Info.plist" | head -1)
            [ -n "$RINFO" ] && plutil -convert xml1 -o - "$RINFO" | tee profile-out/runtime-Info.plist

            RPROF=$(find "$RT" -maxdepth 4 -name "profile.plist" | head -1)
            [ -n "$RPROF" ] && plutil -convert xml1 -o - "$RPROF" | tee profile-out/runtime-profile.plist
          fi

          # Ground truth for the two category methods the device just
          # revealed: -[NSString sim_packedVersion] and -[NSString sim_cpuType].
          # Both are currently stubbed to nil, which is exactly why parsing a
          # real profile silently yields no device types -- CoreSimulator asks
          # "16.1" for its packed version and "arm64" for its cpu type and
          # gets nothing back. Guessing the packing arithmetic risks producing
          # values that compare wrongly, so read the real implementation.
          CSU=/Library/Developer/PrivateFrameworks/CoreSimulator.framework/Versions/A/Frameworks/CoreSimulatorUtilities.framework/Versions/A/CoreSimulatorUtilities
          echo "=== CoreSimulatorUtilities: $CSU ==="
          ls -la "$CSU" 2>&1 || echo "(not found)"

          if [ -f "$CSU" ]; then
            lipo -thin arm64e "$CSU" -output csu_thin.bin 2>/dev/null || cp "$CSU" csu_thin.bin
            file csu_thin.bin

            echo "=== any sim_ symbols (categories are local syms, so -a) ==="
            nm -a csu_thin.bin 2>/dev/null | grep -i "sim_packedVersion\|sim_cpuType\|sim_realPath" \
              | tee profile-out/csu-sim-symbols.txt || echo "(none)"

            otool -tV csu_thin.bin > csu-disasm.txt 2>/dev/null || true
            wc -l csu-disasm.txt

            for fn in sim_packedVersion sim_cpuType; do
              echo "=== disassembly: $fn ==="
              grep -n "$fn\]:" csu-disasm.txt | head -3
              LINE=$(grep -n "$fn\]:" csu-disasm.txt | head -1 | cut -d: -f1)
              if [ -n "$LINE" ]; then
                sed -n "${LINE},$((LINE+90))p" csu-disasm.txt \
                  | tee "profile-out/disasm-$fn.txt"
              else
                echo "(symbol not found in disassembly)" | tee "profile-out/disasm-$fn.txt"
              fi
            done
          fi

          # Disassemble SimRuntime's registration + availability validation
          # from the CoreSimulator binary itself. The device reported
          # SimError 401 "Runtime bundle is missing a RuntimeRoot" from
          # -[SimRuntime initWithBundle:error:]; reading the real code shows
          # exactly WHAT it checks (just the directory's existence, or
          # specific files inside like the dyld shared cache), which decides
          # whether the whole 16GB tree is needed or only a subset.
          echo "=== disassembling SimRuntime validation methods ==="
          otool -tV coresim_thin.bin > cs-disasm.txt 2>/dev/null || true
          wc -l cs-disasm.txt
          for fn in \
            "initWithBundle:error:" \
            "isAvailableWithError:" \
            "runtimeRootURL" \
            "libLaunchURL" \
            "createInitialContentPath:error:" \
            "sampleContentPath" \
            "dyldSharedCacheIsUsable"; do
            echo "=== -[SimRuntime $fn] ==="
            LINE=$(grep -nF "SimRuntime $fn]:" cs-disasm.txt | head -1 | cut -d: -f1)
            if [ -n "$LINE" ]; then
              sed -n "${LINE},$((LINE+140))p" cs-disasm.txt \
                | tee "profile-out/disasm-SimRuntime-$(echo $fn | tr -d ':').txt"
            else
              echo "(not found)" | tee "profile-out/disasm-SimRuntime-$(echo $fn | tr -d ':').txt"
            fi
          done

          # The literal strings near those checks (RuntimeRoot, usr/lib/dyld,
          # System/..., dyld_shared_cache_*) reveal the exact paths probed.
          # Every sim_-prefixed selector in both binaries, at once. These
          # category methods have been surfacing one per device round trip
          # (sim_realPath, sim_packedVersion, sim_cpuType, sim_copyItemAtPath,
          # sim_realPathHasPrefix, and now sim_reentrantSafeCreateDirectoryAtPath),
          # each costing a build + install + crash. The full list lets them be
          # implemented in one pass instead.
          # Boot's only remaining blocker is a pre-flight resource check:
          #   Code=67 "insufficient system resources ... maxUserProcs: 1,
          #   runningUserProcs: 0, enforcedProcBuffer: 100"
          # It never reaches posix_spawn. Read how SimHostResourceChecker
          # obtains those numbers -- sysctl, getrlimit, or something else --
          # since that determines whether the value can be influenced.
          echo "=== SimHostResourceChecker methods ==="
          nm -a coresim_thin.bin 2>/dev/null | grep -i "SimHostResourceChecker" \
            | tee profile-out/resourcechecker-symbols.txt || echo "(none)"

          echo "=== how it queries the limits ==="
          for pat in "maxUserProcs" "enforcedProcBuffer" "runningUserProcs" \
                     "kern.maxproc" "maxprocperuid" "insufficient system resources"; do
            echo "--- $pat ---"
            strings -a coresim_thin.bin 2>/dev/null | grep -i "$pat" | head -5
          done | tee profile-out/resourcecheck-strings.txt || true

          echo "=== sysctl/rlimit imports (does it ask the kernel directly?) ==="
          nm -mu coresim_thin.bin 2>/dev/null \
            | grep -iE "sysctl|getrlimit|proc_listpids|proc_pidinfo|kinfo" \
            | tee profile-out/resourcecheck-imports.txt || echo "(none)"

          for fn in "checkResourcesForBootWithError:" "maxUserProcs" \
                    "runningUserProcs" "enforcedProcBuffer"; do
            echo "=== disasm: $fn ==="
            LINE=$(grep -nF "SimHostResourceChecker $fn]:" cs-disasm.txt | head -1 | cut -d: -f1)
            if [ -n "$LINE" ]; then
              sed -n "${LINE},$((LINE+70))p" cs-disasm.txt \
                | tee "profile-out/disasm-RC-$(echo $fn | tr -d ':').txt"
            else
              echo "(not found)"
            fi
          done

          echo "=== all sim_ selectors in CoreSimulator + CoreSimulatorUtilities ==="
          { strings -a coresim_thin.bin 2>/dev/null; strings -a csu_thin.bin 2>/dev/null; } \
            | grep -oE "sim_[A-Za-z0-9_:]+" | sort -u \
            | tee profile-out/all-sim-selectors.txt || true
          wc -l profile-out/all-sim-selectors.txt

          echo "=== RuntimeRoot-relative path strings in the binary ==="
          strings -a coresim_thin.bin 2>/dev/null \
            | grep -iE "RuntimeRoot|dyld_shared_cache|usr/lib/dyld|/System/Library/Caches|libLaunch|shared_cache" \
            | sort -u | head -40 | tee profile-out/runtimeroot-strings.txt || true

          # Device types are now registering on-device, so the runtime is the
          # whole remaining question -- and it's the half that carries iOS 18
          # itself. Settle definitively whether this runner has ANY usable
          # runtime material, since images.plist lists runtimes whose volume
          # paths don't exist and the Cryptex scan found no dmg with UIKit.
          echo "=== anything .simruntime anywhere plausible ==="
          for root in /Library/Developer/CoreSimulator \
                      /Applications/Xcode_16.1.app/Contents/Developer/Platforms/iPhoneOS.platform \
                      "$HOME/Library/Developer/CoreSimulator"; do
            echo "--- $root ---"
            find "$root" -maxdepth 8 -name "*.simruntime" 2>/dev/null | head -10
          done > profile-out/runtime-search.txt 2>&1
          cat profile-out/runtime-search.txt

          echo "=== any RuntimeRoot directory ==="
          find /Library/Developer /Applications/Xcode_16.1.app -maxdepth 10 -type d -name "RuntimeRoot" 2>/dev/null \
            | head -5 | tee profile-out/runtimeroot-search.txt

          echo "=== any runtime-sized dmg (these would BE the runtimes) ==="
          find /Library/Developer /Applications/Xcode_16.1.app -maxdepth 10 -name "*.dmg" -size +200M 2>/dev/null \
            | head -10 | tee profile-out/runtime-dmg-search.txt

          echo "=== what the platform actually ships ==="
          ls -la /Applications/Xcode_16.1.app/Contents/Developer/Platforms/iPhoneOS.platform/Library/Developer/CoreSimulator/ 2>&1 \
            | tee profile-out/platform-coresimulator-dir.txt
          ls -la /Library/Developer/CoreSimulator/Profiles/Runtimes/ 2>&1 \
            | tee -a profile-out/platform-coresimulator-dir.txt

          # The 200MB+ dmgs in CoreSimulator/Images ARE the runtimes (the
          # earlier Cryptex scan looked in the wrong directory). images.plist
          # maps each dmg UUID to its runtimeInfo, so the iOS one is
          # identifiable. Mount it and take ONLY the metadata plists -- a few
          # KB. The RuntimeRoot itself is a complete iOS filesystem, far too
          # large to ship in an IPA, and unusable on-device anyway since
          # booting it means spawning launchd and dozens of daemons as real
          # processes. Registering metadata alone is still worth doing: it
          # makes CoreSimulator state its own reason for calling a runtime
          # unavailable.
          python3 tools/dump_images_plist.py > profile-out/images-plist-full.txt 2>&1 || true
          grep -iE "bundleIdentifier|relative|version|state" profile-out/images-plist-full.txt \
            | head -60 || true

          IOS_DMG=""
          for dmg in /Library/Developer/CoreSimulator/Images/*.dmg; do
            [ -f "$dmg" ] || continue
            UUID=$(basename "$dmg" .dmg)
            if grep -q "$UUID" profile-out/images-plist-full.txt 2>/dev/null; then
              CTX=$(grep -A 12 "$UUID" profile-out/images-plist-full.txt | grep -i "bundleIdentifier" | head -1)
              echo "$UUID -> $CTX"
              case "$CTX" in *iOS*) [ -z "$IOS_DMG" ] && IOS_DMG="$dmg";; esac
            fi
          done | tee profile-out/dmg-identification.txt

          # Fall back to the largest dmg if identification came up empty --
          # the iOS runtime is invariably the biggest one present.
          if [ -z "$IOS_DMG" ]; then
            IOS_DMG=$(ls -S /Library/Developer/CoreSimulator/Images/*.dmg 2>/dev/null | head -1)
          fi
          echo "chosen runtime dmg: $IOS_DMG" | tee -a profile-out/dmg-identification.txt
          ls -lh "$IOS_DMG" 2>&1 | tee -a profile-out/dmg-identification.txt

          if [ -n "$IOS_DMG" ]; then
            MNT=/tmp/simrt
            mkdir -p "$MNT"
            # sudo because the images are root:wheel and CI steps run as
            # `runner` -- the first attempt died with "attach failed -
            # Permission denied", not a format or Cryptex problem.
            sudo hdiutil attach "$IOS_DMG" -mountpoint "$MNT" -nobrowse -readonly 2>&1 \
              | tee profile-out/mount-log.txt || true
            ls -la "$MNT" 2>&1 | head -10 | tee -a profile-out/mount-log.txt || true

            find "$MNT" -maxdepth 6 -name "*.simruntime" 2>/dev/null | head -5 \
              | tee profile-out/mounted-simruntime-paths.txt
            RT=$(head -1 profile-out/mounted-simruntime-paths.txt)

            if [ -n "$RT" ]; then
              echo "=== runtime bundle layout (top levels only) ==="
              find "$RT" -maxdepth 3 2>/dev/null | sed "s|$RT|<RUNTIME>|" | head -30 \
                | tee profile-out/runtime-layout.txt

              for f in Contents/Info.plist Contents/Resources/profile.plist Info.plist profile.plist; do
                if [ -f "$RT/$f" ]; then
                  OUT="profile-out/runtime-$(basename $f)"
                  plutil -convert xml1 -o - "$RT/$f" | tee "$OUT"
                fi
              done

              echo "=== how big is the RuntimeRoot we are NOT shipping ==="
              du -sh "$RT" 2>/dev/null | tee profile-out/runtime-size.txt || true

              # Device creation got FAR: CoreSimulator assigned a UDID, started
              # the device's bootstrap queue, and began populating its data
              # from the runtime's SampleContent -- then NSAssert'd on a nil
              # dictionary because our synthetic RuntimeRoot has no
              # SampleContent. Get the real structure and size: if it's small,
              # it can be shipped or synthesized; if it's huge, that bounds
              # what device creation costs.
              SC="$RT/Contents/Resources/SampleContent"
              echo "=== SampleContent size ==="
              du -sh "$SC" 2>/dev/null | tee profile-out/samplecontent-size.txt || echo "(none)"
              echo "=== SampleContent tree (depth 4) ==="
              find "$SC" -maxdepth 4 2>/dev/null | sed "s|$SC|<SAMPLE>|" | head -60 \
                | tee profile-out/samplecontent-tree.txt || true
              echo "=== plists directly under SampleContent ==="
              find "$SC" -maxdepth 2 -name "*.plist" 2>/dev/null | head -10 \
                | tee profile-out/samplecontent-plists.txt || true
              for p in $(head -3 profile-out/samplecontent-plists.txt 2>/dev/null); do
                echo "--- $p ---"
                plutil -convert xml1 -o - "$p" 2>/dev/null | head -40
              done | tee profile-out/samplecontent-plist-dump.txt || true

              # Stage a METADATA-ONLY .simruntime into the app: Info.plist +
              # Resources/profile.plist, but NOT the 16GB RuntimeRoot and not
              # the macOS launcher binary. This is the cheap pivotal test --
              # does CoreSimulator register a runtime at all, and what does it
              # say it needs for that runtime to become "available"? The
              # answer scopes the whole download effort before a single GB is
              # fetched.
              RTNAME=$(basename "$RT")
              STAGE="staged-runtime/Runtimes/$RTNAME"
              mkdir -p "$STAGE/Contents/Resources"
              cp "$RT/Contents/Info.plist" "$STAGE/Contents/Info.plist" 2>/dev/null || true
              cp "$RT/Contents/Resources/profile.plist" \
                 "$STAGE/Contents/Resources/profile.plist" 2>/dev/null || true

              # SampleContent too: device creation copies this into the new
              # device's data directory, and at 17MB it fits in an IPA
              # comfortably (unlike the 16GB RuntimeRoot). This is the first
              # real runtime CONTENT we ship rather than synthesize.
              if [ -d "$SC" ]; then
                mkdir -p staged-samplecontent
                cp -R "$SC" staged-samplecontent/SampleContent
                du -sh staged-samplecontent/SampleContent
              fi
              echo "=== staged metadata-only runtime bundle ==="
              find staged-runtime | sed "s|staged-runtime|<STAGE>|"
            fi
            sudo hdiutil detach "$MNT" 2>&1 | tail -2 || true
          fi

          # Cheaply confirm the on-device fetch is actually viable for the
          # target version: a HEAD to the 17.5 direct URL (no 7GB pull). If
          # this returns a Content-Length, an NSURLSession download on device
          # would work the same way.
          echo "=== HEAD check: iOS 17.5 direct download URL ==="
          curl -sSIL "https://download.developer.apple.com/Developer_Tools/iOS_17.5_Simulator_Runtime/iOS_17.5_Simulator_Runtime.dmg" 2>&1 \
            | grep -iE "HTTP/|content-length|location" | head -10 \
            | tee profile-out/ios175-head.txt || true

          # What the on-device fetch actually needs: Apple's public index of
          # downloadable simulator runtimes. This signed plist is what Xcode
          # itself reads to fetch runtimes; it lists every runtime dmg with a
          # direct HTTPS URL, version, build and size. Pull it so we have the
          # real iOS 18 URL rather than guessing a CDN path.
          echo "=== Apple simulator-runtime download index ==="
          for URL in \
            "https://devimages-cdn.apple.com/downloads/xcode/simulators/index2.dvtdownloadableindex" \
            "https://devimages-cdn.apple.com/downloads/xcode/simulators/index.dvtdownloadableindex"; do
            echo "--- trying $URL ---"
            if curl -fsSL "$URL" -o index.plist 2>/dev/null; then
              echo "fetched $(wc -c < index.plist) bytes"
              # It's a binary plist wrapping xml; normalise then extract.
              plutil -convert xml1 -o index.xml index.plist 2>/dev/null || cp index.plist index.xml
              cp index.xml profile-out/downloadable-index.xml
              echo "=== iOS runtime entries (name / version / build / URL / size) ==="
              python3 tools/parse_downloadable_index.py index.plist \
                | tee profile-out/ios-runtime-urls.txt
              break
            fi
          done
          echo "(if nothing above, the index moved or needs auth -- the 6.8GB dmg is still on this runner regardless)"

          ls -la profile-out/

      - uses: actions/upload-artifact@v4
        with:
          name: real-profiles
          path: profile-out
          if-no-files-found: warn
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: symbol-recon
          path: recon-out
          if-no-files-found: warn
          retention-days: 14

      - name: Identify which dmg is the iOS 18.1 RuntimeRoot (metadata only, no mounting)
        run: |
          echo "=== images.plist structure ==="
          python3 tools/dump_images_plist.py
          echo "=== Profiles/Runtimes directory ==="
          find /Library/Developer/CoreSimulator/Profiles/Runtimes -maxdepth 3 2>&1 || echo "(no such directory)"

      - name: Mount whatever real Cryptex dmgs actually exist on disk and probe each for UIKit
        timeout-minutes: 8
        run: |
          # images.plist's recorded path for the iOS 18.1 entry doesn't exist
          # on disk -- stale/incomplete metadata, not fixable by parsing it
          # more carefully. Ground truth is the filesystem: find every real
          # .dmg under the Cryptex bundle tree and just try each one directly,
          # confirming by content (does it actually contain UIKit.framework)
          # rather than by trusting any recorded version label.
          echo "=== real dmg files under Cryptex/Images/bundle ==="
          find /Library/Developer/CoreSimulator/Cryptex/Images/bundle -name "*.dmg" 2>&1 | tee /tmp/cryptex_dmgs.txt

          i=0
          while read -r dmg; do
            [ -z "$dmg" ] && continue
            i=$((i+1))
            MP="/tmp/mnt/cryptex$i"
            mkdir -p "$MP"
            if sudo hdiutil attach -nobrowse -readonly -mountpoint "$MP" "$dmg" > /tmp/attach.log 2>&1; then
              HIT=$(find "$MP" -path "*/UIKit.framework/UIKit" -type f 2>/dev/null | head -1)
              echo "$dmg -> mounted at $MP, UIKit found: ${HIT:-no}"
              if [ -n "$HIT" ]; then
                echo "$MP" > /tmp/matched_mountpoint.txt
                echo "*** MATCH ***"
                break
              fi
              sudo hdiutil detach "$MP" -quiet 2>&1 || true
            else
              echo "$dmg -> attach failed"
            fi
          done < /tmp/cryptex_dmgs.txt

          if [ -f /tmp/matched_mountpoint.txt ]; then
            echo "--- contents of matched volume ---"
            find "$(cat /tmp/matched_mountpoint.txt)" -maxdepth 3 2>&1 | head -50
          else
            echo "no dmg under Cryptex/Images/bundle contained UIKit.framework"
          fi

      - name: Dump real Simulator-flavored UIKit/Foundation exported symbols
        run: |
          mkdir -p recon-out2
          SEARCH_ROOT="/tmp/mnt"
          if [ -f /tmp/matched_mountpoint.txt ]; then
            SEARCH_ROOT=$(cat /tmp/matched_mountpoint.txt)
          fi
          UIKIT_SIM=$(find "$SEARCH_ROOT" -path "*/UIKit.framework/UIKit" -type f 2>/dev/null | head -1)
          FOUNDATION_SIM=$(find "$SEARCH_ROOT" -path "*/Foundation.framework/Foundation" -type f 2>/dev/null | head -1)
          echo "UIKit: $UIKIT_SIM"
          echo "Foundation: $FOUNDATION_SIM"

          if [ -n "$UIKIT_SIM" ]; then
            file "$UIKIT_SIM"
            nm -g "$UIKIT_SIM" 2>/dev/null > recon-out2/uikit-sim-exported-symbols.txt || true
            wc -l recon-out2/uikit-sim-exported-symbols.txt
          fi
          if [ -n "$FOUNDATION_SIM" ]; then
            nm -g "$FOUNDATION_SIM" 2>/dev/null > recon-out2/foundation-sim-exported-symbols.txt || true
            wc -l recon-out2/foundation-sim-exported-symbols.txt
          fi
          ls -la recon-out2/

      - uses: actions/upload-artifact@v4
        with:
          name: sim-framework-symbols
          path: recon-out2
          if-no-files-found: warn
          retention-days: 14

      - name: Compile target (as a normal executable first)
        run: |
          SDK=$(DEVELOPER_DIR="$IOS18_DEVELOPER_DIR" xcrun --sdk iphoneos --show-sdk-path)
          DEVELOPER_DIR="$IOS18_DEVELOPER_DIR" clang -arch arm64 -isysroot "$SDK" -miphoneos-version-min=15.0 \
                -fobjc-arc -framework UIKit -framework Foundation \
                -o target_raw target.m

      - name: Patch target into a dlopen-able dylib
        run: |
          python3 tools/patch_macho.py target_raw target.dylib

      - name: Compile Probe app
        run: |
          SDK=$(DEVELOPER_DIR="$IOS18_DEVELOPER_DIR" xcrun --sdk iphoneos --show-sdk-path)
          # -lz: RuntimeFetcher inflates the gzip stream with zlib, which iOS
          # already ships -- that's precisely why CI repacks the runtime as
          # tar.gz instead of leaving it as a UDIF/APFS dmg the device has no
          # way to read.
          DEVELOPER_DIR="$IOS18_DEVELOPER_DIR" clang -arch arm64 -isysroot "$SDK" -miphoneos-version-min=15.0 \
                -fobjc-arc -framework UIKit -framework Foundation -lz \
                -o ProbeBin Probe/main.m Probe/RuntimeFetcher.m

      - name: Compile LaunchHelper extension
        run: |
          SDK=$(DEVELOPER_DIR="$IOS18_DEVELOPER_DIR" xcrun --sdk iphoneos --show-sdk-path)
          # No main() in LaunchHelper/main.m -- entry point is set explicitly
          # to Foundation's own real NSExtensionMain, since raw clang has none
          # of Xcode's implicit app-extension product-type wiring available.
          DEVELOPER_DIR="$IOS18_DEVELOPER_DIR" clang -arch arm64 -isysroot "$SDK" -miphoneos-version-min=15.0 \
                -fobjc-arc -framework UIKit -framework Foundation \
                -Wl,-e,_NSExtensionMain \
                -o LaunchHelperBin LaunchHelper/main.m

      - name: Stage a real .simdevicetype for the app to feed CoreSimulator
        run: |
          # Ship Apple's genuine article rather than a hand-written profile.
          # The dumped schema showed the guessed one was wrong in ways that
          # would have failed silently (mainScreenWidth/Height as strings not
          # a size dict, supportedProductFamilyIDs capitalized,
          # supportedFeatures a dict not an array, no name/identifier keys at
          # all -- those live in Info.plist).
          mkdir -p staged-profiles/DeviceTypes

          # Ordered to match the HOST display pixel-for-pixel. The test device
          # is an iPhone 14 (iPhone14,7): 1170x2532 @3x, 460ppi. Picking that
          # exact device type means a simulated screen would map 1:1 onto the
          # real one -- no scaling, no letterboxing -- which is the difference
          # between "seamless" and "close enough". iPhone 14 Plus/15 share the
          # same panel geometry and are the next-best fallbacks; 16 Pro
          # (1206x2622) deliberately ranks below them despite being newer,
          # since a bigger panel is a worse fit than an identical one.
          for want in "iPhone 14.simdevicetype" "iPhone 15.simdevicetype" \
                      "iPhone 16.simdevicetype" "iPhone 14 Pro.simdevicetype" \
                      "iPhone 15 Pro.simdevicetype" "iPhone 16 Pro.simdevicetype"; do
            DT=$(find /Applications/Xcode_16.1.app -maxdepth 12 -name "$want" 2>/dev/null | head -1)
            [ -n "$DT" ] && break
          done
          if [ -z "$DT" ]; then
            DT=$(find /Applications/Xcode_16.1.app -maxdepth 12 -name "iPhone*.simdevicetype" 2>/dev/null | head -1)
          fi
          if [ -z "$DT" ]; then
            DT=$(find /Applications/Xcode_16.1.app -maxdepth 12 -name "*.simdevicetype" 2>/dev/null | head -1)
          fi
          echo "staging real device type: $DT"
          cp -R "$DT" staged-profiles/DeviceTypes/

          # Drop the macOS executable and the stale signature: a Mach-O built
          # for macOS has no business inside an iOS app bundle, nothing reads
          # it to parse a profile, and leaving either in place only risks
          # upsetting codesign or installd.
          BN=$(basename "$DT")
          rm -rf "staged-profiles/DeviceTypes/$BN/Contents/MacOS" \
                 "staged-profiles/DeviceTypes/$BN/Contents/_CodeSignature"

          find staged-profiles

      - name: Assemble .app bundle
        run: |
          mkdir -p Payload/Probe.app
          cp ProbeBin Payload/Probe.app/Probe
          cp Probe/Info.plist Payload/Probe.app/Info.plist
          cp target.dylib Payload/Probe.app/target.dylib

          mkdir -p Payload/Probe.app/PlugIns/LaunchHelper.appex
          cp LaunchHelperBin Payload/Probe.app/PlugIns/LaunchHelper.appex/LaunchHelper
          cp LaunchHelper/Info.plist Payload/Probe.app/PlugIns/LaunchHelper.appex/Info.plist
          cp target.dylib Payload/Probe.app/PlugIns/LaunchHelper.appex/target.dylib

          cp coresim_patched.dylib Payload/Probe.app/coresim_target.dylib
          mkdir -p Payload/Probe.app/Frameworks
          cp coresim-stub-out/* Payload/Probe.app/Frameworks/

          # Also ship CoreSimulator as a REAL framework bundle. Boot reached
          # -[SimDeviceIOServer loadAllBundlesWithError:], which does
          # [NSBundle bundleWithIdentifier:@"com.apple.CoreSimulator"] to find
          # its own framework and load the device-IO plugins from it, and
          # threw "Failed to find bundle with identifier" -- a bare dylib
          # belongs to no bundle. The Info.plist is a checked-in file, not a
          # heredoc: heredoc bodies sit at column 0 and terminate the YAML
          # `run: |` block, which has already corrupted this workflow twice.
          FW=Payload/Probe.app/Frameworks/CoreSimulator.framework
          mkdir -p "$FW"
          cp coresim_patched.dylib "$FW/CoreSimulator"
          cp coresim-stubs/CoreSimulator-Framework-Info.plist "$FW/Info.plist"
          find "$FW"

          cp -R staged-profiles Payload/Probe.app/RealProfiles
          # Metadata-only runtime bundle, if the mount step produced one.
          if [ -d staged-runtime ]; then
            cp -R staged-runtime/Runtimes Payload/Probe.app/RealProfiles/Runtimes
          fi
          if [ -d staged-samplecontent/SampleContent ]; then
            cp -R staged-samplecontent/SampleContent Payload/Probe.app/RealProfiles/SampleContent
            du -sh Payload/Probe.app/RealProfiles/SampleContent
          fi
          find Payload/Probe.app/RealProfiles

      - name: Ad-hoc sign with entitlements (App Group intent for AltStore's resign to carry forward)
        run: |
          # Ad-hoc (-s -), not a real identity -- AltStore replaces this
          # signature entirely at install time. The point is embedding the
          # App Group entitlement so its resigning tool has something to
          # read and request a matching capability for, same pattern real
          # sideloaded apps ship with. Nested code signed first.
          codesign -s - --entitlements LaunchHelper/LaunchHelper.entitlements \
                --force Payload/Probe.app/PlugIns/LaunchHelper.appex
          codesign -s - --entitlements Probe/Probe.entitlements \
                --force Payload/Probe.app

      - name: Zip .ipa
        run: |
          zip -r Probe-unsigned.ipa Payload
          # also keep the loose .app around for inspection
          # Deliberately NOT copying Probe.app out for upload any more. Now
          # that SampleContent ships, the tree contains a file with a colon in
          # its name (RebuildThumbnails_20180706-231725-07:00), and GitHub
          # artifacts reject colons outright -- which failed the upload and
          # cost a build. The .ipa is a zip, so it carries that name fine;
          # only the loose directory upload was the problem.

      - uses: actions/upload-artifact@v4
        with:
          name: probe-build
          path: |
            Probe-unsigned.ipa
          retention-days: 14
