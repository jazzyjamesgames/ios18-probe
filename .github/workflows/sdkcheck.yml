name: sdk-check
on: { workflow_dispatch: {} }
jobs:
  check:
    runs-on: macos-14
    steps:
      - run: |
          ls /Applications | grep -i xcode || true
          echo '---'
          for d in /Applications/Xcode*.app; do
            echo "==  =="
            /usr/bin/xcrun --sdk iphoneos --show-sdk-version --toolchain ""/Contents/Developer 2>&1 || true
            ""/Contents/Developer/usr/bin/xcodebuild -version 2>&1 || true
            ls "/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/" 2>&1 || true
          done
